name: ETF opsiyon geriye dönük test (SPY/QQQ)

# Elle çalıştırılır. SPY/QQQ kısa vade sinyali → call alımı → gerçek geçmiş opsiyon fiyatları (Alpaca).
# Sonuç: Telegram'a ve iş özetine.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Başlangıç (YYYY-AA-GG, en erken 2024-02)"
        default: "2024-03-01"

jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: ETF opsiyon testi
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ETF_START: ${{ inputs.start }}
        run: |
          set -o pipefail
          node options/etf-backtest.mjs | tee out.txt
          { echo '```'; sed -n '/^SONUÇ/,$p' out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Sonucu Telegram'a gönder
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          BT_INFO: "SPY/QQQ kısa vade → call · ${{ inputs.start }} sonrası · commit ${{ github.sha }}"
        run: node options/send-report.mjs out.txt
      - name: Hata alarmı
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node bot/alert.mjs
