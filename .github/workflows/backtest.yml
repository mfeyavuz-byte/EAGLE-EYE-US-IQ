name: Opsiyon geriye dönük test

# Elle çalıştırılır. Alpaca anahtarları repo secret'larından gelir (yerelde anahtar gerekmez).
# Sonuç: Telegram'a, iş özetine (Summary) ve işlem listesi artifact olarak.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Evren: en likit N hisse"
        default: "120"
      step:
        description: "Giriş sıklığı (işlem günü; 5 = haftalık)"
        default: "5"
      start:
        description: "Başlangıç (YYYY-AA-GG, en erken 2024-02)"
        default: "2024-03-01"
      min_dte:
        description: "En kısa vade (gün; 35 = normal, 180 = LEAPS testi)"
        default: "35"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Geriye dönük test
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BT_N: ${{ inputs.n }}
          BT_STEP: ${{ inputs.step }}
          BT_START: ${{ inputs.start }}
          BT_MIN_DTE: ${{ inputs.min_dte }}
          BT_OUT: trades.json
        run: |
          set -o pipefail
          node options/backtest.mjs | tee out.txt
          { echo '```'; sed -n '/^SONUÇ/,$p' out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Sonucu Telegram'a gönder
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          BT_INFO: "Evren ${{ inputs.n }} hisse · her ${{ inputs.step }} işlem günü · ${{ inputs.start }} sonrası · vade ≥ ${{ inputs.min_dte }}g · commit ${{ github.sha }}"
        run: node options/send-report.mjs out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opsiyon-backtest
          path: |
            out.txt
            trades.json
      - name: Hata alarmı
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node bot/alert.mjs
