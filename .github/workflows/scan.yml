name: EAGLE-EYE US IQ — Spot + Opsiyon

# GitHub cron'u UTC'dir ve tetikleri atlayabilir/geciktirebilir. Bu yüzden cron yalnızca
# DÖNGÜYÜ BAŞLATIR; iş içinde piyasa kapanana dek her ~10 dk tarar (erken tespit; tarama ~1,5 dk sürer).
# ABD seansı 09:30–16:00 New York = 13:30–20:00 UTC (yaz) / 14:30–21:00 UTC (kış).
# Piyasa kapalıysa run.mjs 3 koduyla çıkar → döngü biter; sonraki cron yeniden dener.
on:
  schedule:
    - cron: "45 12 * * 1-5"   # açılış öncesi (yaz: 08:45 NY)
    - cron: "15 13 * * 1-5"   # açılış öncesi (kış: 08:15 NY)
    - cron: "35 13 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "35 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "0 19 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Piyasa kapalıyken de tara (test)"
        type: boolean
        default: false

concurrency:
  group: abd-loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Bağımlılık (yapay zekâ yorumu için; başarısız olursa bot yorumsuz çalışır)
        continue-on-error: true
        run: npm install --no-audit --no-fund --omit=dev
      - name: Birim testleri (bozuk kodla çalışma — hata alarmı tetiklenir)
        run: npm test
      - name: Seans boyunca her ~10 dk tara
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PAPER_TRADE: ${{ vars.PAPER_TRADE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          set +e
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node bot/run.mjs; rc=$?
            echo "Manuel tetik — tek run (çıkış $rc)."
            [ $rc -eq 1 ] && exit 1 || exit 0
          fi
          for i in $(seq 1 28); do   # 28 × (~10 dk + ~1,5 dk tarama) ≈ 330 dk < 355 dk iş sınırı; kalan seansı sonraki cron devralır
            echo "=== İterasyon $i · NY $(TZ=America/New_York date +%H:%M) ==="
            node bot/run.mjs; rc=$?
            if [ $rc -eq 3 ]; then echo "Piyasa kapalı — döngü bitti."; break; fi
            sleep 600
          done
          exit 0
      - name: Hata alarmı
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node bot/alert.mjs
