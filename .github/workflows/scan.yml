name: EAGLE-EYE US IQ — Spot + Opsiyon

# KESİNTİSİZ ZİNCİR: GitHub cron'u bu depoda saatlerce gecikiyor/atlanıyor (23–25 Kasım: tetikler 6+ saat geç ya da hiç).
# Bu yüzden bot cron'a BAĞIMLI DEĞİL: her çalışma ~5,5 saat sürer, bitmeden kendi yerine yenisini başlatır
# (workflow_dispatch, GITHUB_TOKEN) → 7/24 tek bir zincir. Eşzamanlılık grubu aynı anda en çok 1 çalışma + 1 bekleyen tutar.
# Döngü içinde: run.mjs her 10 dk (sabah mesajı 07:30–09:29 NY, seans taraması, Telegram komutları — gece de cevaplanır);
# bot/idx15.mjs her çeyrek saat (SPY/QQQ 15 dk opsiyon fikri, 09:45–15:45 NY); ARKA PLANDA bot/fast.mjs ~30 sn'de bir
# ani hareket/dönüş alarmı (16 likit sembol, anında). main'e yeni kod gelirse zincir yeni kodla yenilenir.
# Cron'lar yalnız YEDEK: zincir bir şekilde koparsa (ör. GitHub kesintisi) ilk gelen tetik zinciri yeniden kurar.
on:
  # Türkiye saatiyle 15:30 → 00:30 her yarım saat (TR = UTC+3, yaz saati yok) = 12:30 → 21:30 UTC, Pzt–Cum.
  # 15:30/16:00 TR: ABD yaz saatinde (Mart–Kasım) sabah SPY/QQQ mesajı açılıştan önce gelsin diye (NY 08:30/09:00).
  # Bir döngü çalışırken gelen tetik kuyrukta bekler (yenisi eskisinin yerini alır) → atlanan cron'a karşı yedek.
  schedule:
    - cron: "30 12-21 * * 1-5"   # TR 15:30, 16:30, … 00:30
    - cron: "0 13-21 * * 1-5"    # TR 16:00, 17:00, … 00:00
  workflow_dispatch:
    inputs:
      force:
        description: "Piyasa kapalıyken de tara (test)"
        type: boolean
        default: false

concurrency:
  group: abd-loop
  cancel-in-progress: false

permissions:
  contents: read
  actions: write     # zinciri sürdürmek için kendi kendini tetikler

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Bağımlılık (yapay zekâ yorumu için; başarısız olursa bot yorumsuz çalışır)
        continue-on-error: true
        run: npm install --no-audit --no-fund --omit=dev
      - name: Birim testleri (bozuk kodla çalışma — hata alarmı tetiklenir)
        run: npm test
      - name: Kesintisiz döngü (tarama 10 dk · SPY/QQQ fikri 15 dk · ~5,5 saat)
        id: loop
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PAPER_TRADE: ${{ vars.PAPER_TRADE }}
          PAPER_OPT: ${{ vars.PAPER_OPT }}               # sanal opsiyon işlemi: boş = AÇIK, 0 = kapalı (yalnız paper-api)
          OPT_PAPER_BUDGET: ${{ vars.OPT_PAPER_BUDGET }} # fikir başına sanal bütçe (boş = $1.000)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          set +e
          if [ -n "$FORCE" ]; then   # "force" (piyasa kapalıyken test): tek tarama + tek 15 dk fikri; ardından zincir yine başlar
            node bot/run.mjs; rc=$?
            node bot/idx15.mjs
            FAST_ONCE=1 node bot/fast.mjs
            echo "Zorla test — tek run (çıkış $rc)."
            [ $rc -eq 1 ] && exit 1 || exit 0
          fi
          # Ani hareket alarmı ARKA PLANDA kesintisiz (tarama sürerken de çalışır); süreç ~55 dk'da bir tazelenir, çökerse 10 sn'de yeniden başlar
          ( while :; do timeout 3600 node bot/fast.mjs; sleep 10; done ) &
          FAST_PID=$!
          trap 'kill $FAST_PID 2>/dev/null; pkill -f "node bot/fast.mjs" 2>/dev/null; true' EXIT
          t0=$(date +%s); last_scan=0; last_q=""; last_git=$t0
          while [ $(( $(date +%s) - t0 )) -lt 19800 ]; do          # 330 dk; 355 dk iş sınırının altında
            now=$(date +%s)
            q=$(TZ=America/New_York date +%Y%m%d%H)$(( 10#$(TZ=America/New_York date +%M) / 15 ))
            if [ "$q" != "$last_q" ]; then                           # her çeyrek saat (NY :00 :15 :30 :45)
              last_q=$q
              timeout 300 node bot/idx15.mjs        # takılırsa 5 dk sonra kes (zincir kopmasın)
            fi
            if [ $(( now - last_scan )) -ge 600 ]; then
              last_scan=$now
              echo "=== Tarama · NY $(TZ=America/New_York date +%H:%M) ==="
              timeout 900 node bot/run.mjs
            fi
            if [ $(( now - last_git )) -ge 1800 ]; then              # 30 dk'da bir: main'e yeni kod geldi mi?
              last_git=$now
              head=$(git ls-remote origin refs/heads/main 2>/dev/null | cut -f1)
              if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then echo "main'de yeni kod ($head) — zincir yeni kodla yenileniyor."; break; fi
            fi
            sleep 20
          done
          exit 0
      - name: Zinciri sürdür (sonraki çalışmayı başlat)
        # Testler bozuksa (döngü atlandı) zincir DURUR → hata alarmı gelir; hızlı başarısız-yeniden-başla döngüsü olmaz.
        # "force" işaretli test çalışması da zinciri başlatır (sonraki çalışma force'suz, normal döngüdür).
        if: ${{ always() && steps.loop.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" --ref main && { echo "Sonraki çalışma kuyruğa alındı."; exit 0; }
            sleep 30
          done
          echo "Zincir sürdürülemedi!"; exit 1
      - name: Hata alarmı
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node bot/alert.mjs
