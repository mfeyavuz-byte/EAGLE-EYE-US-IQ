name: EAGLE-EYE US IQ — Spot + Opsiyon

# GitHub cron'u UTC'dir ve tetikleri atlayabilir/geciktirebilir. Bu yüzden cron yalnızca
# DÖNGÜYÜ BAŞLATIR; iş içinde piyasa kapanana dek her ~10 dk tarar (erken tespit; tarama ~1,5 dk sürer).
# ABD seansı 09:30–16:00 New York = 13:30–20:00 UTC (yaz) / 14:30–21:00 UTC (kış).
# Piyasa kapalıysa run.mjs 3 koduyla çıkar → döngü biter; sonraki cron yeniden dener.
on:
  # Türkiye saatiyle 15:30 → 00:30 her yarım saat (TR = UTC+3, yaz saati yok) = 12:30 → 21:30 UTC, Pzt–Cum.
  # 15:30/16:00 TR: ABD yaz saatinde (Mart–Kasım) sabah SPY/QQQ mesajı açılıştan önce gelsin diye (NY 08:30/09:00).
  # Bir döngü çalışırken gelen tetik kuyrukta bekler (yenisi eskisinin yerini alır) → atlanan cron'a karşı yedek.
  schedule:
    - cron: "30 12-21 * * 1-5"   # TR 15:30, 16:30, … 00:30
    - cron: "0 13-21 * * 1-5"    # TR 16:00, 17:00, … 00:00
  workflow_dispatch:
    inputs:
      force:
        description: "Piyasa kapalıyken de tara (test)"
        type: boolean
        default: false

concurrency:
  group: abd-loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Bağımlılık (yapay zekâ yorumu için; başarısız olursa bot yorumsuz çalışır)
        continue-on-error: true
        run: npm install --no-audit --no-fund --omit=dev
      - name: Birim testleri (bozuk kodla çalışma — hata alarmı tetiklenir)
        run: npm test
      - name: Seans boyunca her ~10 dk tara
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PAPER_TRADE: ${{ vars.PAPER_TRADE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          set +e
          if [ -n "$FORCE" ]; then   # yalnız "force" (piyasa kapalıyken test) tek run; normal manuel tetik de döngü kurar
            node bot/run.mjs; rc=$?
            echo "Zorla test — tek run (çıkış $rc)."
            [ $rc -eq 1 ] && exit 1 || exit 0
          fi
          for i in $(seq 1 28); do   # 28 × (~10 dk + ~1,5 dk tarama) ≈ 330 dk < 355 dk iş sınırı; kalan seansı sonraki cron devralır
            hm=$(TZ=America/New_York date +%H%M)
            echo "=== İterasyon $i · NY ${hm:0:2}:${hm:2:2} ==="
            node bot/run.mjs; rc=$?
            if [ $rc -eq 3 ]; then
              # Açılış öncesi (07:00–09:29 NY) kapalı = henüz açılmadı → bekle; sonrası/tatil = döngü biter
              if [ $((10#$hm)) -ge 700 ] && [ $((10#$hm)) -lt 930 ]; then echo "Açılış bekleniyor."; else echo "Piyasa kapalı — döngü bitti."; break; fi
            fi
            sleep 600
          done
          exit 0
      - name: Hata alarmı
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node bot/alert.mjs
