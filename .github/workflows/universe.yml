name: EAGLE-EYE US IQ — Evren Yenile (haftalık)

# S&P 500 + Nasdaq listesi değişir (halka arzlar, endeks değişiklikleri, likidite).
# Her Pazar evreni yeniden kurar ve spot/universe.json değiştiyse repoya commit eder.
on:
  schedule:
    - cron: "0 6 * * 0"     # Pazar 06:00 UTC (piyasa kapalı)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abd-universe
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Evreni kur
        run: node universe/build.mjs
      - name: Değiştiyse commit et
        run: |
          if git diff --quiet -- spot/universe.json; then echo "Değişiklik yok."; exit 0; fi
          git config user.name "abd-bot"
          git config user.email "abd-bot@users.noreply.github.com"
          git add spot/universe.json
          git commit -m "Evren güncellendi ($(date -u +%F))"
          git push
      - name: Hata alarmı
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node bot/alert.mjs
